<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Panel de administración - Login</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Configuración Tailwind INLINE -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1152d4",
                        secondary: "#0a1e4d",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622"
                    },
                    fontFamily: {
                        display: ["Inter", "system-ui", "sans-serif"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/portal-inicio-facultades.css">
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden bg-gradient-mesh">
    
    <!-- Burbujas de fondo animadas -->
    <div class="background-bubbles">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
    </div>

    <!-- Botón modo oscuro - ESTILO UNIFICADO CON PORTAL -->
    <button id="theme-toggle" class="fixed top-6 right-6 z-50 w-14 h-14 rounded-full glass-card flex items-center justify-center cursor-pointer group hover:scale-110 transition-all duration-300" aria-label="Cambiar tema">
        <!-- Icono Sol (Light Mode) -->
        <span class="material-symbols-outlined text-2xl text-amber-500 dark:hidden group-hover:rotate-90 transition-transform duration-300">
            light_mode
        </span>
        <!-- Icono Luna (Dark Mode) -->
        <span class="material-symbols-outlined text-2xl text-blue-300 hidden dark:block group-hover:-rotate-12 transition-transform duration-300">
            dark_mode
        </span>
    </button>

    <!-- Contenido principal -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        
        <!-- Card de login con estilo glass-card -->
        <div class="glass-card w-full max-w-[480px] rounded-xl p-10 relative z-10">
            
            <!-- Icono -->
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20">
                    <span class="material-symbols-outlined text-white text-4xl">account_balance</span>
                </div>
            </div>

            <!-- Título -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold tracking-tight text-slate-800 dark:text-white leading-tight mb-2">
                    Panel de Administración
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-base font-medium">
                    Ingreso para personal administrativo 
                </p>
            </div>

            <!-- Formulario -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2 ml-1" for="username">Usuario</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                        <input class="w-full pl-12 pr-4 py-3 bg-slate-50/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none dark:text-white placeholder:text-slate-400 text-base" id="username" name="username" placeholder="Ingrese su usuario" type="text"/>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2 ml-1" for="password">Contraseña</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                        <input class="w-full pl-12 pr-4 py-3 bg-slate-50/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none dark:text-white placeholder:text-slate-400 text-base" id="password" name="password" placeholder="••••••••" type="password"/>
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 rounded-lg bg-gradient-to-r from-primary to-secondary text-white font-semibold text-lg btn-glow flex items-center justify-center gap-2 mt-8">
                    <span>Ingresar</span>
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
                </button>
            </form>

            <!-- Link para solicitar acceso -->
            <div class="mt-8 text-center">
            </div>
        </div>
    </main>

    <!-- FOOTER CON SOMBRA GLASS - ESTILO UNIFICADO -->
    <footer class="glass-footer w-full py-6 mt-auto relative z-10">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="h-8 w-8 bg-primary rounded flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-sm">auto_awesome</span>
                </div>
                <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">
                    © 2026 Universidad Nacional Mayor de San Marcos - Sistema de Racionalización v2.0
                </p>
            </div>
            <div class="flex gap-8 text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
                <a class="hover:text-primary transition-colors" href="#">Términos de Uso</a>
                <a class="hover:text-primary transition-colors" href="#">Privacidad</a>
                <a class="hover:text-primary transition-colors" href="#">Cookies</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/components/api.js"></script>
    <script src="js/portal-inicio-racio.js"></script>
</body>
</html>
