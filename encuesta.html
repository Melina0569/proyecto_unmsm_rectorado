<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encuesta - DataInsight</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/encuesta.css">
</head>

<body>

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <div class="navbar-container">

            <div class="brand">
                DataInsight
            </div>

            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="index.html" class="active">Módulos</a>
                <a href="#">Analytics</a>
                <a href="#">Reportes</a>
            </div>

            <div class="nav-actions">

                <button class="icon-button">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                </button>

                <button class="icon-button">
                    <span class="material-symbols-outlined">
                        help
                    </span>
                </button>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="main-container">

        <section class="survey-card">

            <!-- =============================================
                 CABECERA
            ============================================== -->

            <div class="survey-header">

                <div class="header-overlay"></div>

                <div class="header-content">

                    <div class="module-label">

                        <span class="material-symbols-outlined"
                              id="moduleIcon">
                            school
                        </span>

                        <span id="moduleName">
                            Módulo Estudiantes
                        </span>

                    </div>

                    <h1 id="surveyTitle">
                        Perfil del Estudiante
                    </h1>

                    <p id="surveyDescription">
                        Complete la siguiente información inicial
                        para adecuar el cuestionario a su perfil.
                    </p>

                </div>

            </div>


            <!-- =============================================
                 FORMULARIO
            ============================================== -->

            <div class="survey-body">

                <form id="profileForm">

                    <div id="fieldsContainer">

                        <!-- Los campos se generan desde encuesta.js -->

                    </div>


                    <!-- DIVISOR -->

                    <hr class="divider">


                    <!-- =====================================
                         ACCIONES
                    ====================================== -->

                    <div class="form-actions">

                        <button
                            type="button"
                            id="cancelButton"
                            class="btn btn-secondary">

                            Cancelar

                        </button>


                        <button
                            type="submit"
                            id="continueButton"
                            class="btn btn-primary">

                            <span>
                                Responder encuesta
                            </span>

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <div class="footer-container">

            <div>

                <strong>
                    DataInsight
                </strong>

                <span>
                    © 2026 DataInsight Analytics.
                </span>

            </div>

            <div class="footer-links">

                <a href="#">
                    Política de privacidad
                </a>

                <a href="#">
                    Términos de servicio
                </a>

                <a href="#">
                    Contacto
                </a>

            </div>

        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/encuesta.js"></script>

</body>
</html>
