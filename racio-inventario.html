<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racio Inventario | SIGPRO</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#1152d4", "background-light": "#f6f6f8", "background-dark": "#101622" }, fontFamily: { display: ["Inter", "sans-serif"] } } }
        };
    </script>

    <link rel="stylesheet" href="css/racio-inicio.css" />
    <link rel="stylesheet" href="css/racio-repositorio.css" />
</head>
<body class="bg-background-light text-slate-900 font-display min-h-screen flex flex-col" id="racio-body">
    <header class="admin-header bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1 rounded flex items-center justify-center">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <span class="font-bold text-xl text-gray-800 tracking-tight">SIGPRO</span>
            </div>
            <nav class="hidden md:flex space-x-8 text-sm font-medium text-gray-600">
                <a class="hover:text-blue-600 transition-colors" href="racio-inicio.html">Inicio</a>
                <a class="text-blue-600 border-b-2 border-blue-600 pb-1" href="racio-repositorio.html">Repositorio</a>
            </nav>
            <div class="flex items-center gap-3">
                <button id="theme-toggle" class="theme-toggle-btn w-10 h-10 rounded-full border border-slate-200 bg-white text-slate-600 hover:text-blue-600 transition-all flex items-center justify-center" type="button">
                    <span id="theme-icon" class="material-symbols-outlined text-xl">dark_mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div class="flex items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-black tracking-tight">DETALLE DEL INVENTARIO</h1>
                <p class="text-slate-500 mt-1" id="detalle-descripcion">-</p>
            </div>
            <button id="back-button" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-bold hover:border-primary hover:text-primary transition-all" type="button">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Volver
            </button>
        </div>

        <section id="detail-section" class="repo-detail">
            <div class="flex flex-col xl:flex-row gap-6">
                <aside class="xl:w-[360px] detail-info-card">
                    <div class="detail-info-header">
                        <h3 class="flex items-center gap-2"><span class="material-symbols-outlined">info</span>Detalles</h3>
                    </div>
                    <div id="detail-info-body" class="detail-info-body"></div>
                </aside>
                <div class="flex-1 detail-main-panel">
                    <div class="detail-chart-wrap">
                        <div class="detail-chart-head">
                            <h3 class="flex items-center gap-2"><span class="material-symbols-outlined text-primary">analytics</span><span id="detail-chart-title">Histórico</span></h3>
                        </div>
                        <div id="detail-chart-grid" class="detail-chart-grid"></div>
                    </div>
                    <div class="detail-analysis-wrap">
                        <div class="detail-analysis-head">
                            <h3 class="flex items-center gap-2"><span class="material-symbols-outlined text-primary">troubleshoot</span>ANÁLISIS</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="detail-table">
                                <thead>
                                    <tr>
                                        <th>N°</th>
                                        <th>Fecha</th>
                                        <th>Resultado</th>
                                        <th>Meta</th>
                                        <th>% Cumplimiento</th>
                                        <th>Observación</th>
                                    </tr>
                                </thead>
                                <tbody id="detail-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="admin-footer bg-white border-t border-gray-200 mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-gray-500 font-medium">© 2026 Oficina General de Planificación - UNMSM</p>
        </div>
    </footer>

    <script src="js/components/api.js"></script>
    <script>
        const STORAGE_KEYS = { DOCUMENTOS_LISTA: "sigpro_documentos_lista" };
        function normalizeText(value) { return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
        function formatDate(value) { const date = new Date(value || ""); return Number.isNaN(date.getTime()) ? "-" : new Intl.DateTimeFormat("es-PE", { day: "2-digit", month: "short", year: "numeric" }).format(date); }
        function typeLabel(type) { const map = { "indicador": "Indicador", "flujograma": "Flujograma", "inventario": "Inventario", "caracterizacion": "Caracterización" }; return map[type] || "Proceso"; }
        function statusLabel(value) { const text = normalizeText(value); return text.includes("aprob") || text.includes("complet") ? "Aprobado" : text.includes("proceso") ? "En proceso" : "Pendiente"; }
        function buildChartSvg(points) { const xStep = 800 / Math.max(points.length - 1, 1); const toY = (value) => 300 - Math.max(0, Math.min(100, value)) * 3; const resultLine = points.map((value, index) => `${index * xStep},${toY(value)}`).join(" "); const targetLine = points.map((_, index) => `${index * xStep},${toY(60)}`).join(" "); const circles = points.map((value, index) => `<circle cx="${index * xStep}" cy="${toY(value)}" r="4" fill="#1152d4"></circle>`).join(""); return `<svg viewBox="0 0 800 300" preserveAspectRatio="none" aria-hidden="true"><polyline points="${targetLine}" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"></polyline><polyline points="${resultLine}" fill="none" stroke="#1152d4" stroke-width="3"></polyline>${circles}</svg>`; }
        function buildHistoryRows(doc) { const seed = doc.codigo.length + doc.descripcion.length; const rows = []; for (let i = 0; i < 4; i += 1) { const result = 35 + ((seed + i * 7) % 55); const target = 60; const compliance = Math.round((result / target) * 100); rows.push({ number: i + 1, date: formatDate(new Date(doc.fecha.getTime() - (3 - i) * 2629800000)), result, target, compliance, note: compliance >= 100 ? "Dentro de parámetros." : "Reforzar acciones." }); } return rows; }
        function renderDetail(doc) {
            if (!doc) { document.getElementById("detail-section").classList.add("hidden"); return; }
            document.getElementById("detalle-descripcion").textContent = doc.descripcion;
            const detailBody = document.getElementById("detail-info-body");
            if (detailBody) { detailBody.innerHTML = `<div class="detail-field"><p class="label">Facultad</p><p class="value">${doc.facultad}</p></div><div class="detail-field"><p class="label">Código</p><p class="value">${doc.codigo}</p></div><div class="detail-field"><p class="label">Tipo</p><p class="value">${typeLabel(doc.tipo)}</p></div><div class="detail-field"><p class="label">Estado</p><p class="value">${doc.estado}</p></div><div class="detail-field"><p class="label">Fecha</p><p class="value">${formatDate(doc.fecha)}</p></div>`; }
            const chartGrid = document.getElementById("detail-chart-grid");
            if (chartGrid) { const points = buildHistoryRows(doc).map((row) => row.result); chartGrid.innerHTML = buildChartSvg(points); }
            const tableBody = document.getElementById("detail-table-body");
            if (tableBody) { const rows = buildHistoryRows(doc).map((row) => `<tr><td>${row.number}</td><td>${row.date}</td><td>${row.result}%</td><td>${row.target}%</td><td><span class="detail-badge">${row.compliance}%</span></td><td>${row.note}</td></tr>`).join(""); tableBody.innerHTML = rows; }
        }
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const codigo = params.get("codigo") || "";
            if (!codigo) { document.getElementById("detail-section").classList.add("hidden"); return; }
            const raw = localStorage.getItem(STORAGE_KEYS.DOCUMENTOS_LISTA);
            const docs = raw ? JSON.parse(raw) : [];
            const doc = docs.find((d) => d.codigo === codigo || d.code === codigo);
            if (doc) {
                const processedDoc = { codigo: doc.codigo || doc.code || "DOC-SIN-CODIGO", descripcion: doc.descripcion || doc.nombre || `Documento`, facultad: doc.nombreFacultad || doc.facultad || "Facultad", unidad: doc.unidad || "Unidad", tipo: doc.tipo || "inventario", estado: statusLabel(doc.estado || doc.status || "aprobado"), fecha: new Date(doc.fechaAprobacion || doc.fecha || new Date()) };
                renderDetail(processedDoc);
            } else {
                document.getElementById("detail-section").classList.add("hidden");
            }
            document.getElementById("back-button").addEventListener("click", () => window.history.back());
            const body = document.getElementById("racio-body");
            const toggle = document.getElementById("theme-toggle");
            const icon = document.getElementById("theme-icon");
            if (body && toggle && icon) { const savedTheme = localStorage.getItem("theme") || "light"; if (savedTheme === "dark") { body.classList.add("theme-dark"); icon.textContent = "light_mode"; } toggle.addEventListener("click", () => { const isDark = body.classList.toggle("theme-dark"); localStorage.setItem("theme", isDark ? "dark" : "light"); icon.textContent = isDark ? "light_mode" : "dark_mode"; }); }
        });
    </script>
</body>
</html>
